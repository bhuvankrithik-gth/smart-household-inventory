name: Publish production update
on:
  workflow_dispatch: {}
jobs:
  publish_update:
    type: update
    environment: production
    params:
      channel: production
      platform: android
      message: "Fixes: stay signed in, category picker, receipt OCR auto-read, back buttons, DD-MM-YYYY expiry, in-form barcode scan, shopping line totals, Insights cleanup"
